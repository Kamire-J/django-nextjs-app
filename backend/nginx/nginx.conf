upstream django_backend {
    server web:8000;  # Points to the Django container
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name demo.devprattle.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt ACME Challenge for SSL verification
    location /.well-known/acme-challenge/ {
        root /var/www/demo.devprattle.com/html;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name demo.devprattle.com;

    # SSL certificate and key paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/demo.devprattle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.devprattle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to Django backend
    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve media files
    location /media/ {
        alias /usr/src/django_backend/media/;
    }

    # WebSocket support
    location ~^/ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
