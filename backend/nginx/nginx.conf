upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name demo.devprattle.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.devprattle.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/demo.devprattle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.devprattle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to Django backend
    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve media files
    location /media/ {
        alias /usr/src/django_backend/media/;
    }

    # Serve static files
    location /static/ {
        alias /usr/src/django_backend/static/;
    }

    # WebSocket configuration
    location ~^/ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
