upstream django_backend {
    server web:8000;
}

server {
    listen 443 ssl;
    server_name demo.devprattle.com;

    ssl_certificate /etc/letsencrypt/live/demo.devprattle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.devprattle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /media/ {
        alias /usr/src/django_backend/media/;
    }

    location /static/ {
        alias /usr/src/django_backend/static/;
    }

    location ~^/ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name demo.devprattle.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
