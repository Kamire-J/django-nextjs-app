services:
  caddy:
    image: caddy:latest
    ports:
      - "8080:80"   # Use port 8080 for HTTP
      - "8443:443"  # Use port 8443 for HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - media_volume:/usr/src/django_backend/media
      - static_volume:/usr/src/django_backend/static
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - daphne

  web:
    build: ./django_backend
    command: gunicorn django_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./django_backend/:/usr/src/django_backend/
      - media_volume:/usr/src/django_backend/media
      - static_volume:/usr/src/django_backend/static
    expose:
      - 8000
    env_file:
      - ./.env.dev
    depends_on:
      - db

  daphne:
    build: ./django_backend
    command: daphne --bind 0.0.0.0 -p 8002 django_backend.asgi:application
    expose:
      - "8002"

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=djangobnb

volumes:
  postgres_data:
  media_volume:
  static_volume:
  caddy_data:
  caddy_config:
